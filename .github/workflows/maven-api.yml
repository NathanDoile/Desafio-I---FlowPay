name: Pipeline API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api/**'


permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Rodar Testes com Maven
        run: mvn -B clean verify -f pom.xml

      - name: Analisar com SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=NathanDoile_Desafio-I---FlowPay
          -Dsonar.organization=nathandoile
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -f pom.xml

      - name: Armazenar o artefato (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: pacote-da-aplicacao
          path: api/target/*.jar

      # --- ETAPAS DE DEPLOY AUTOMÁTICO NO GCP ---

      - name: Autenticar no Google Cloud via Workload Identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/533550007480/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@flowpay-cloud.iam.gserviceaccount.com'

      - name: Configurar o Google Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker no Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Construir e Enviar Imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/flowpay-cloud/flowpay-repo/flowpay-api:${{ github.sha }} .
          docker push southamerica-east1-docker.pkg.dev/flowpay-cloud/flowpay-repo/flowpay-api:${{ github.sha }}

      - name: Fazer Deploy no Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud run deploy flowpay-api \
            --image southamerica-east1-docker.pkg.dev/flowpay-cloud/flowpay-repo/flowpay-api:${{ github.sha }} \
            --platform managed \
            --region southamerica-east1 \
            --allow-unauthenticated \
            --memory=1024Mi \
            --add-cloudsql-instances flowpay-cloud:southamerica-east1:flowpay-mysql-v2 \
            --set-env-vars "^~^SPRING_DATASOURCE_URL=jdbc:mysql:///flowpay_db?unixSocketPath=/cloudsql/flowpay-cloud:southamerica-east1:flowpay-mysql-v2~SPRING_DATASOURCE_USERNAME=flowpay_user~SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }}~SPRING_JPA_HIBERNATE_DDL_AUTO=validate~URL_ORIGINS=${{ secrets.URL_ORIGINS }}"